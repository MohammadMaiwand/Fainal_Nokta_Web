version: "3.9"

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      PORT: 8081
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/nokta_academy
      JWT_SECRET: replace_with_secure_secret_at_least_32_characters
      REFRESH_SECRET: replace_with_refresh_secret_at_least_32_characters
      CSRF_SECRET: replace_with_csrf_secret_at_least_32_characters
      PUBLIC_APP_URL: http://127.0.0.1:4173
      EMAIL_ENABLED: "true"
      EMAIL_MODE: smtp
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMS_ENABLED: "true"
      SMS_MODE: console
      INTEGRATIONS_STRICT: "false"
      PAYMENT_PROVIDER: manual
      PAYMENT_MODE: sandbox
      AI_PROVIDER_ENABLED: "false"
      AI_PROVIDER_API_KEY: ""
      AI_ALLOW_SENSITIVE_EXTERNAL: "false"
      ENABLE_JOBS: "true"
    ports:
      - "8081:8081"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8081/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://127.0.0.1:8081/api
        VITE_ENABLE_DEMO_LOGIN: "true"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4173:4173"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4173/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mongo_data:
