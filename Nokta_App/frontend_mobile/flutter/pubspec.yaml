name: nokta_academy
description: Nokta Academy mobile-only app (Android/iOS) for the Nokta backend APIs.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  connectivity_plus: ^6.1.4
  shared_preferences: ^2.5.3
  equatable: ^2.0.7
  shamsi_date: ^1.1.0
  package_info_plus: ^8.3.0
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.6
  build_runner: ^2.4.15
  http_mock_adapter: ^0.6.1
  flutter_native_splash: ^2.4.5

flutter_native_splash:
  color: "#4F46E5"
  android_12:
    color: "#4F46E5"
  android: true
  ios: false
  web: false

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
